<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#1976d2"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.35" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#e3f2fd" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#90caf9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#42a5f5" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- database cylinder -->
  <g fill="url(#db)">
    <path d="M62 78 v100 c0 15 25 27 56 27 s56 -12 56 -27 V78 z"/>
    <ellipse cx="118" cy="78" rx="56" ry="24" fill="#64b5f6"/>
  </g>
  <!-- disk separators -->
  <path d="M62 112 c0 15 25 27 56 27 s56 -12 56 -27" fill="none" stroke="#0d47a1" stroke-width="7" stroke-linecap="round"/>
  <path d="M62 146 c0 15 25 27 56 27 s56 -12 56 -27" fill="none" stroke="#0d47a1" stroke-width="7" stroke-linecap="round"/>
  <!-- top ellipse rim -->
  <ellipse cx="118" cy="78" rx="56" ry="24" fill="none" stroke="#0d47a1" stroke-width="7"/>

  <!-- magnifying glass -->
  <g>
    <circle cx="156" cy="140" r="46" fill="url(#lens)"/>
    <circle cx="156" cy="140" r="46" fill="none" stroke="#eceff1" stroke-width="13"/>
    <line x1="190" y1="174" x2="224" y2="208" stroke="#eceff1" stroke-width="20" stroke-linecap="round"/>
    <!-- lens glint -->
    <path d="M132 120 a30 30 0 0 1 22 -10" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
